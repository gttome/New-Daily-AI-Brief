name: Reader Parity Validation

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "legacy_snapshot"
      - "migration/ndaib-jekyll.yml"
      - "scripts/build_reader_parity_manifest.py"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "legacy_snapshot"
      - "migration/ndaib-jekyll.yml"
      - "scripts/build_reader_parity_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconcile historical migration
        run: |
          python scripts/build_reader_parity_manifest.py             --legacy-root legacy_snapshot             --output _artifacts/data-parity-manifest.json
          python - <<'PY'
          import json
          p=json.load(open("_artifacts/data-parity-manifest.json",encoding="utf-8"))
          assert p["parity_status"]=="reconciled", p
          assert p["unexplained_mismatches"]==[], p
          assert p["post_cutoff_editions_imported"] is False
          PY

      - name: Upload historical parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: ndaib-reader-history-parity-${{ github.sha }}
          path: _artifacts/data-parity-manifest.json
