name: Greenfield Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Contract, discovery, editorial, and recovery tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
