name: Greenfield Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Classify changed paths and validation scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" > changed-files.txt
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              git ls-files > changed-files.txt
            else
              git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed-files.txt
            fi
          fi
          echo "Changed files:"
          cat changed-files.txt
          python scripts/select_validation.py             --changed-file-list changed-files.txt             --output validation-selection.json

      - name: Run bounded Development and Integration Validation
        run: |
          python scripts/run_validation.py             --selection validation-selection.json             --evidence validation-evidence.json

      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-validation-${{ github.sha }}
          path: |
            changed-files.txt
            validation-selection.json
            validation-evidence.json
          if-no-files-found: warn
