name: Manual Daily Brief — canonical greenfield run

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Edition date (YYYY-MM-DD)"
        required: true
        type: string
      edition_json:
        description: "Optional authoritative edition JSON override. Leave blank for live discovery on a new date."
        required: false
        default: ""
        type: string
      watchlist_json:
        description: "Optional Watchlist JSON override when using an authoritative edition package"
        required: false
        default: ""
        type: string
      approved_image_manifest:
        description: "Optional repository-relative manifest for six professionally generated/accepted live images. Leave blank to stop safely at the image gate."
        required: false
        default: ""
        type: string
      force_replace_existing_edition:
        description: "Replace this live edition from fresh discovery instead of resuming its saved checkpoint"
        required: false
        default: false
        type: boolean

  push:
    branches: [main]
    paths:
      - "ops/manual-daily-brief-continuation.json"

permissions:
  contents: read

concurrency:
  group: manual-daily-brief-${{ inputs.edition_date || github.sha }}
  cancel-in-progress: false

jobs:
  canonical-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out greenfield source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve workflow event inputs
        id: event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EDITION_DATE: ${{ inputs.edition_date }}
          INPUT_EDITION_JSON: ${{ inputs.edition_json }}
          INPUT_WATCHLIST_JSON: ${{ inputs.watchlist_json }}
          INPUT_APPROVED_IMAGE_MANIFEST: ${{ inputs.approved_image_manifest }}
          INPUT_FORCE_REPLACE: ${{ inputs.force_replace_existing_edition }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "edition_date=$INPUT_EDITION_DATE"
              echo "edition_json=$INPUT_EDITION_JSON"
              echo "watchlist_json=$INPUT_WATCHLIST_JSON"
              echo "approved_image_manifest=$INPUT_APPROVED_IMAGE_MANIFEST"
              echo "force_replace=$INPUT_FORCE_REPLACE"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            python - "ops/manual-daily-brief-continuation.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_path, output_path = map(pathlib.Path, sys.argv[1:3])
          payload = json.loads(request_path.read_text(encoding="utf-8"))
          if payload.get("active") is not True:
              raise SystemExit("continuation request is not active")
          date = str(payload.get("edition_date") or "")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date):
              raise SystemExit("continuation edition_date must be YYYY-MM-DD")
          manifest = str(payload.get("approved_image_manifest") or "")
          if not manifest or not pathlib.Path(manifest).is_file():
              raise SystemExit(f"continuation approved image manifest missing: {manifest}")
          if payload.get("force_replace_existing_edition") not in (False, None):
              raise SystemExit("push continuation never permits force replacement")
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"edition_date={date}\n")
              fh.write("edition_json=\n")
              fh.write("watchlist_json=\n")
              fh.write(f"approved_image_manifest={manifest}\n")
              fh.write("force_replace=false\n")
          print(json.dumps({"edition_date": date, "approved_image_manifest": manifest, "force_replace": False}))
          PY
          else
            echo "unsupported event: $EVENT_NAME" >&2
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve manual input mode
        id: mode
        shell: bash
        env:
          EDITION_DATE: ${{ steps.event.outputs.edition_date }}
          EDITION_JSON: ${{ steps.event.outputs.edition_json }}
          APPROVED_IMAGE_MANIFEST: ${{ steps.event.outputs.approved_image_manifest }}
          FORCE_REPLACE: ${{ steps.event.outputs.force_replace }}
        run: |
          set -euo pipefail
          [[ "$EDITION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "edition_date must be YYYY-MM-DD" >&2
            exit 2
          }
          if [[ -n "$APPROVED_IMAGE_MANIFEST" && ! -f "$APPROVED_IMAGE_MANIFEST" ]]; then
            echo "approved_image_manifest does not exist: $APPROVED_IMAGE_MANIFEST" >&2
            exit 2
          fi
          if [[ "$FORCE_REPLACE" == "true" ]]; then
            if [[ "$EDITION_DATE" < "2026-09-24" ]]; then
              echo "force_replace_existing_edition is only allowed for live editions on or after 2026-09-24; migrated history through 2026-09-23 is protected" >&2
              exit 2
            fi
            if [[ -n "$EDITION_JSON" || -n "$APPROVED_IMAGE_MANIFEST" ]]; then
              echo "force_replace_existing_edition starts a fresh live discovery run; leave edition_json and approved_image_manifest blank" >&2
              exit 2
            fi
            echo "mode=live_editorial" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$EDITION_JSON" ]]; then
            [[ -f "$EDITION_JSON" ]] || {
              echo "authoritative edition_json does not exist: $EDITION_JSON" >&2
              exit 2
            }
            echo "mode=authoritative_package" >> "$GITHUB_OUTPUT"
          elif [[ -f "legacy_snapshot/_data/editions/$EDITION_DATE.json" ]]; then
            echo "mode=authoritative_package" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live_editorial" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore durable live-run checkpoint
        if: steps.mode.outputs.mode == 'live_editorial'
        uses: actions/cache/restore@v4
        with:
          path: |
            .state/manual
            .runtime-inputs/${{ steps.event.outputs.edition_date }}
          key: manual-daily-brief-v2-${{ steps.event.outputs.edition_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            manual-daily-brief-v2-${{ steps.event.outputs.edition_date }}-

      - name: Force-replace this live edition checkpoint
        if: steps.mode.outputs.mode == 'live_editorial' && steps.event.outputs.force_replace == 'true'
        shell: bash
        env:
          EDITION_DATE: ${{ steps.event.outputs.edition_date }}
        run: |
          set -euo pipefail
          echo "Force replace enabled for $EDITION_DATE"
          rm -rf ".state/manual/${EDITION_DATE}__production" ".runtime-inputs/${EDITION_DATE}"
          mkdir -p .state/manual ".runtime-inputs/${EDITION_DATE}"
          printf '%s\n'             '{'             '  "schema_version": "1.0.0",'             '  "edition_date": "'"$EDITION_DATE"'",'             '  "force_replace": true,'             '  "effect": "discarded prior cached checkpoint for this edition only",'             '  "historical_editions_protected_through": "2026-09-23"'             '}' > ".runtime-inputs/${EDITION_DATE}/force-replace-receipt.json"

      - name: Resolve durable live-run checkpoint
        if: steps.mode.outputs.mode == 'live_editorial'
        id: checkpoint
        shell: bash
        env:
          EDITION_DATE: ${{ steps.event.outputs.edition_date }}
        run: |
          set -euo pipefail
          mkdir -p .state/manual ".runtime-inputs/$EDITION_DATE"
          python - "$EDITION_DATE" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          date,out=sys.argv[1:3]
          root=pathlib.Path(".runtime-inputs")/date
          run_path=pathlib.Path(".state/manual")/f"{date}__production"/"run.json"
          stage="none"
          if run_path.exists():
              run=json.loads(run_path.read_text(encoding="utf-8"))
              completion=run.get("completion_status")
              if completion=="build_locked" and (root/"operational-input-manifest.json").exists() and (root/"live-media.json").exists():
                  stage="build"
              elif completion=="editorial_locked" and (root/"live-input-manifest.json").exists() and (root/"editorial"/"source-catalog.json").exists():
                  stage="editorial"
          with open(out,"a",encoding="utf-8") as fh:
              fh.write(f"stage={stage}\n")
          print(json.dumps({"edition_date":date,"checkpoint":stage}))
          PY

      - name: Check out read-only discovery and publication adapter
        if: steps.mode.outputs.mode == 'live_editorial'
        uses: actions/checkout@v4
        with:
          repository: gttome/Daily-AI-Brief
          ref: 4ac06268048a3241d2ecaa5ce7c2638266500d75
          path: .live-discovery-adapter
          fetch-depth: 1
          persist-credentials: false

      - name: Discover fresh public-source article evidence
        if: steps.mode.outputs.mode == 'live_editorial' && steps.checkpoint.outputs.stage == 'none'
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p ".live-discovery-adapter/_records/discovery-preflight/result"
          pushd .live-discovery-adapter >/dev/null
          export DAB_RESEARCH_CUTOFF="$cutoff"
          export DAB_DISCOVERY_FRESH=1
          export DAB_SOURCE_SCAN_MIN=12
          export DAB_SOURCE_SCAN_MAX=48
          export DAB_FRESH_METADATA_TARGET=24
          node _tools/discover-sources.mjs
          node _tools/enrich-metadata-dates.mjs \
            --input _data/media-candidate-queue.json \
            --receipt _records/discovery-preflight/result/date-enrichment.json \
            --limit 48 \
            --cutoff "$cutoff"
          node _tools/under80-metadata-gate.mjs \
            --input _data/media-candidate-queue.json \
            --out _records/discovery-preflight/result/metadata-candidates.json \
            --limit 20 \
            --cutoff "$cutoff"
          node _tools/under80-evidence-preflight.mjs \
            --input _records/discovery-preflight/result/metadata-candidates.json \
            --out _records/discovery-preflight/result/article-evidence.json \
            --receipt _records/discovery-preflight/result/article-evidence-receipt.json
          popd >/dev/null

      - name: Prepare authoritative historical/full inputs
        if: steps.mode.outputs.mode == 'authoritative_package'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --edition-date "${{ steps.event.outputs.edition_date }}"
            --legacy-root legacy_snapshot
            --output-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}"
          )
          if [[ -n "${{ steps.event.outputs.edition_json }}" ]]; then
            args+=(--edition-json "${{ steps.event.outputs.edition_json }}")
          fi
          if [[ -n "${{ steps.event.outputs.watchlist_json }}" ]]; then
            args+=(--watchlist-json "${{ steps.event.outputs.watchlist_json }}")
          fi
          PYTHONPATH=src python scripts/prepare_legacy_run_inputs.py "${args[@]}"

      - name: Prepare live greenfield editorial inputs
        if: steps.mode.outputs.mode == 'live_editorial' && steps.checkpoint.outputs.stage == 'none'
        run: |
          PYTHONPATH=src python scripts/prepare_live_editorial_inputs.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --metadata-json .live-discovery-adapter/_records/discovery-preflight/result/metadata-candidates.json \
            --evidence-json .live-discovery-adapter/_records/discovery-preflight/result/article-evidence.json \
            --evidence-receipt-json .live-discovery-adapter/_records/discovery-preflight/result/article-evidence-receipt.json \
            --legacy-root legacy_snapshot \
            --output-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}"

      - name: Lock canonical live editorial selection
        if: steps.mode.outputs.mode == 'live_editorial' && steps.checkpoint.outputs.stage == 'none'
        run: |
          PYTHONPATH=src python scripts/manual_canonical_run.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --input-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}" \
            --state-root ".state/manual" \
            --editorial-only

      - name: Discover and verify live videos and podcasts
        if: steps.mode.outputs.mode == 'live_editorial' && steps.checkpoint.outputs.stage != 'build'
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(python - <<'PY'
          import json
          p=json.load(open(".runtime-inputs/${{ steps.event.outputs.edition_date }}/live-input-manifest.json",encoding="utf-8"))
          print(p["metadata_cutoff"])
          PY
          )"
          python scripts/discover_live_media.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --editorial-catalog ".runtime-inputs/${{ steps.event.outputs.edition_date }}/editorial/source-catalog.json" \
            --config config/live-media-sources.json \
            --cutoff "$cutoff" \
            --output ".runtime-inputs/${{ steps.event.outputs.edition_date }}/live-media.json"

      - name: Prepare live Watchlist, book bridges, and image request
        if: steps.mode.outputs.mode == 'live_editorial' && steps.checkpoint.outputs.stage != 'build'
        run: |
          PYTHONPATH=src python scripts/prepare_live_operational_inputs.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --input-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}" \
            --state-root ".state/manual" \
            --media-json ".runtime-inputs/${{ steps.event.outputs.edition_date }}/live-media.json" \
            --legacy-root legacy_snapshot

      - name: Lock canonical Building stage
        if: steps.mode.outputs.mode == 'live_editorial' && steps.checkpoint.outputs.stage != 'build'
        run: |
          PYTHONPATH=src python scripts/manual_canonical_run.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --input-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}" \
            --state-root ".state/manual" \
            --build-only

      - name: Invoke canonical RunEngine for authoritative package
        if: steps.mode.outputs.mode == 'authoritative_package'
        run: |
          PYTHONPATH=src python scripts/manual_canonical_run.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --input-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}" \
            --state-root ".state/manual"

      - name: Set up Ruby for approved-image publication continuation
        if: steps.mode.outputs.mode == 'live_editorial' && steps.event.outputs.approved_image_manifest != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install bounded reader build dependencies
        if: steps.mode.outputs.mode == 'live_editorial' && steps.event.outputs.approved_image_manifest != ''
        run: gem install jekyll jekyll-theme-cayman webrick --no-document

      - name: Assemble full live edition from canonical locks and approved images
        if: steps.mode.outputs.mode == 'live_editorial' && steps.event.outputs.approved_image_manifest != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime-source .publication-stage .runtime-site
          cp -a legacy_snapshot .runtime-source
          python scripts/build_live_edition.py \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --input-root ".runtime-inputs/${{ steps.event.outputs.edition_date }}" \
            --state-root ".state/manual" \
            --runtime-root .runtime-source \
            --approved-image-manifest "${{ steps.event.outputs.approved_image_manifest }}" \
            --approved-image-root .

      - name: Generate full reader publication candidate
        if: steps.mode.outputs.mode == 'live_editorial' && steps.event.outputs.approved_image_manifest != ''
        shell: bash
        run: |
          set -euo pipefail
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          review="_records/image-quality/${{ steps.event.outputs.edition_date }}-greenfield-handoff.json"
          node .live-discovery-adapter/_generator/cli.mjs generate \
            --root .runtime-source \
            --edition ".runtime-source/_data/editions/${{ steps.event.outputs.edition_date }}.json" \
            --out .publication-stage \
            --baseline-sha "$GITHUB_SHA" \
            --observed-at "$observed" \
            --run-id "greenfield-manual-${{ steps.event.outputs.edition_date }}" \
            --image-review "$review"
          cp -a .publication-stage/. .runtime-source/
          python scripts/build_reader_bundle.py \
            --legacy-root .runtime-source \
            --destination .runtime-site \
            --config migration/ndaib-jekyll.yml \
            --site-url https://ndaib.gtome.chatgpt.site \
            --greenfield-sha "$GITHUB_SHA" \
            --live-edition-date "${{ steps.event.outputs.edition_date }}"
          python scripts/validate_live_reader_candidate.py \
            --site-root .runtime-site \
            --edition-json ".runtime-source/_data/editions/${{ steps.event.outputs.edition_date }}.json" \
            --edition-date "${{ steps.event.outputs.edition_date }}" \
            --target-url https://ndaib.gtome.chatgpt.site

      - name: Manual run summary
        if: always()
        shell: bash
        env:
          INPUT_MODE: ${{ steps.mode.outputs.mode }}
          EDITION_DATE: ${{ steps.event.outputs.edition_date }}
          APPROVED_IMAGE_MANIFEST: ${{ steps.event.outputs.approved_image_manifest }}
          FORCE_REPLACE: ${{ steps.event.outputs.force_replace }}
        run: |
          {
            echo "### Manual Daily Brief"
            echo "- Edition: **$EDITION_DATE**"
            echo "- Input mode: **$INPUT_MODE**"
            echo "- Force replace requested: **$FORCE_REPLACE**"
            if [[ "$INPUT_MODE" == "live_editorial" ]]; then
              echo "- Fresh article discovery/evidence: **locked**"
              echo "- Videos/podcasts: **2 + 2 verified and locked**"
              echo "- Watchlist and book bridges: **locked**"
              echo "- Canonical RunEngine checkpoint: **build_locked**"
              echo "- Image request: \`.runtime-inputs/$EDITION_DATE/image-generation-request.json\`"
              if [[ -n "$APPROVED_IMAGE_MANIFEST" ]]; then
                echo "- Approved-image continuation: **publication candidate built and QA validated if prior steps passed**"
                echo "- Site-ready bundle: \`.runtime-site\`"
                echo "- Native ChatGPT Site synchronization: **not executed by GitHub; requires the authorized Sites publish surface**"
              else
                echo "- Professional image gate: **awaiting six accepted OpenAI-generated images**"
                echo "- Publication attempted: **no**"
              fi
            else
              echo "- Canonical RunEngine depth: **complete prepared-package run**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save durable live-run checkpoint
        if: always() && steps.mode.outputs.mode == 'live_editorial'
        uses: actions/cache/save@v4
        with:
          path: |
            .state/manual
            .runtime-inputs/${{ steps.event.outputs.edition_date }}
          key: manual-daily-brief-v2-${{ steps.event.outputs.edition_date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve canonical run state, evidence, and publication candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-run-${{ steps.event.outputs.edition_date }}
          path: |
            .state/manual
            .runtime-inputs/${{ steps.event.outputs.edition_date }}
            .live-discovery-adapter/_records/discovery-preflight/result
            .runtime-source/_data/editions/${{ steps.event.outputs.edition_date }}.json
            .runtime-source/_records/image-quality/${{ steps.event.outputs.edition_date }}-greenfield-handoff.json
            .publication-stage
            .runtime-site
            .runtime-site.runtime
          if-no-files-found: error
          retention-days: 30
