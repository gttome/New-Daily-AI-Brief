name: Full System Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Comprehensive suite or rerun scope
        required: true
        type: choice
        default: all
        options:
          - all
          - python-comprehensive
          - reader-comprehensive
          - command-center-comprehensive
      reason:
        description: Reason/context for this explicitly requested validation
        required: true
        type: string
      tested_ref:
        description: Branch, tag, or SHA to test
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  full-system-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: ruby/setup-ruby@v1
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        with:
          ruby-version: '3.3'

      - name: Install reader build dependencies
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        run: gem install jekyll jekyll-theme-cayman webrick --no-document

      - name: Initialize evidence
        shell: bash
        env:
          FSV_REASON: ${{ inputs.reason }}
          FSV_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          mkdir -p "evidence/full-system-validation/${GITHUB_RUN_ID}"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path("evidence/full-system-validation") / os.environ["GITHUB_RUN_ID"] / "manifest.json"
          p.write_text(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "tested_sha": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "reason": os.environ["FSV_REASON"],
              "requested_suite": os.environ["FSV_SUITE"],
              "workflow": "Full System Validation",
              "production_mutation": False,
              "test_inventory": [
                  "python-comprehensive",
                  "reader-comprehensive",
                  "command-center-comprehensive"
              ]
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Python comprehensive
        if: inputs.suite == 'all' || inputs.suite == 'python-comprehensive'
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "evidence/full-system-validation/${GITHUB_RUN_ID}/python-comprehensive.log"

      - name: Approved image package integrity
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        run: python scripts/validate_approved_image_packages.py

      - name: Publication adapter freshness
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        run: python scripts/patch_publication_adapter.py --adapter-root legacy_snapshot --check

      - name: Legacy canonical manual-run fixture
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ndaib-inputs /tmp/ndaib-state
          PYTHONPATH=src python scripts/prepare_legacy_run_inputs.py             --edition-date 2026-09-23             --legacy-root legacy_snapshot             --output-root /tmp/ndaib-inputs
          PYTHONPATH=src python scripts/manual_canonical_run.py             --edition-date 2026-09-23             --input-root /tmp/ndaib-inputs             --state-root /tmp/ndaib-state

      - name: Reconcile historical migration
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        run: |
          python scripts/build_reader_parity_manifest.py \
            --legacy-root legacy_snapshot \
            --output _artifacts/data-parity-manifest.json
          python - <<'PY'
          import json
          p=json.load(open("_artifacts/data-parity-manifest.json",encoding="utf-8"))
          assert p["parity_status"]=="reconciled", p
          assert p["unexplained_mismatches"]==[], p
          assert p["post_cutoff_editions_imported"] is False
          PY

      - name: Build final target reader bundle
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        run: |
          python scripts/build_reader_bundle.py \
            --legacy-root legacy_snapshot \
            --destination _site \
            --config migration/ndaib-jekyll.yml \
            --site-url https://ndaib.gtome.chatgpt.site \
            --greenfield-sha "$GITHUB_SHA"
          python scripts/build_reader_parity_manifest.py \
            --legacy-root legacy_snapshot \
            --site-root _site \
            --output _artifacts/data-parity-manifest.json

      - name: Validate final reader bundle
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        run: python scripts/validate_reader_bundle.py --site-root _site --target-url https://ndaib.gtome.chatgpt.site

      - name: Validate live operational publication plumbing
        if: inputs.suite == 'all' || inputs.suite == 'reader-comprehensive'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ndaib-live-inputs /tmp/ndaib-live-state /tmp/ndaib-live-source /tmp/ndaib-live-stage /tmp/ndaib-live-site
          PYTHONPATH=src python scripts/prepare_live_editorial_inputs.py \
            --edition-date 2026-09-24 \
            --metadata-json fixtures/live-manual/metadata-candidates.json \
            --evidence-json fixtures/live-manual/article-evidence.json \
            --evidence-receipt-json fixtures/live-manual/article-evidence-receipt.json \
            --legacy-root legacy_snapshot \
            --output-root /tmp/ndaib-live-inputs
          PYTHONPATH=src python scripts/manual_canonical_run.py \
            --edition-date 2026-09-24 \
            --input-root /tmp/ndaib-live-inputs \
            --state-root /tmp/ndaib-live-state \
            --editorial-only
          cp fixtures/live-manual/media-discovery.json /tmp/ndaib-live-inputs/live-media.json
          PYTHONPATH=src python scripts/prepare_live_operational_inputs.py \
            --edition-date 2026-09-24 \
            --input-root /tmp/ndaib-live-inputs \
            --state-root /tmp/ndaib-live-state \
            --media-json /tmp/ndaib-live-inputs/live-media.json \
            --legacy-root legacy_snapshot
          PYTHONPATH=src python scripts/manual_canonical_run.py \
            --edition-date 2026-09-24 \
            --input-root /tmp/ndaib-live-inputs \
            --state-root /tmp/ndaib-live-state \
            --build-only
          cp -a legacy_snapshot /tmp/ndaib-live-source
          python scripts/build_live_edition.py \
            --edition-date 2026-09-24 \
            --input-root /tmp/ndaib-live-inputs \
            --state-root /tmp/ndaib-live-state \
            --runtime-root /tmp/ndaib-live-source \
            --approved-image-manifest fixtures/live-manual/approved-images.json \
            --approved-image-root legacy_snapshot \
            --allow-fixture-images
          node legacy_snapshot/_generator/cli.mjs generate \
            --root /tmp/ndaib-live-source \
            --edition /tmp/ndaib-live-source/_data/editions/2026-09-24.json \
            --out /tmp/ndaib-live-stage \
            --baseline-sha "$GITHUB_SHA" \
            --observed-at 2026-09-24T02:00:00Z \
            --run-id greenfield-ci-2026-09-24 \
            --image-review _records/image-quality/2026-09-24-greenfield-handoff.json
          cp -a /tmp/ndaib-live-stage/. /tmp/ndaib-live-source/
          python scripts/build_reader_bundle.py \
            --legacy-root /tmp/ndaib-live-source \
            --destination /tmp/ndaib-live-site \
            --config migration/ndaib-jekyll.yml \
            --site-url https://ndaib.gtome.chatgpt.site \
            --greenfield-sha "$GITHUB_SHA" \
            --live-edition-date 2026-09-24
          python scripts/validate_live_reader_candidate.py \
            --site-root /tmp/ndaib-live-site \
            --edition-json /tmp/ndaib-live-source/_data/editions/2026-09-24.json \
            --edition-date 2026-09-24 \
            --target-url https://ndaib.gtome.chatgpt.site

      - name: Command Center comprehensive
        if: inputs.suite == 'all' || inputs.suite == 'command-center-comprehensive'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_command_center_snapshot.py             --repo-root .             --main-sha "$(git rev-parse HEAD)"             --output "/tmp/command-center-state.json"
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_command_center.py' -v 2>&1 | tee "evidence/full-system-validation/${GITHUB_RUN_ID}/command-center.log"
          node --check site/command-center/cc.js

      - name: Final evidence metadata
        if: always()
        shell: bash
        env:
          FSV_REASON: ${{ inputs.reason }}
          FSV_SUITE: ${{ inputs.suite }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, subprocess
          from pathlib import Path
          p=Path("evidence/full-system-validation") / os.environ["GITHUB_RUN_ID"] / "run-metadata.json"
          p.write_text(json.dumps({
              "completed_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "tested_sha": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "requested_suite": os.environ["FSV_SUITE"],
              "reason": os.environ["FSV_REASON"],
              "production_mutation": False
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload Full System Validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-validation-${{ github.run_id }}
          path: evidence/full-system-validation/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
