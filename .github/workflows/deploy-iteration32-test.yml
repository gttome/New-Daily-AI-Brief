name: Reader Parity Engineering Preview

on:
  workflow_run:
    workflows: ["Greenfield Contracts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reader-parity-engineering-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Resolve source
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.source_sha }}
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install bounded reader build dependencies
        run: gem install jekyll jekyll-theme-cayman webrick --no-document

      - name: Reconcile historical migration
        run: |
          python scripts/build_reader_parity_manifest.py \
            --legacy-root legacy_snapshot \
            --output _artifacts/data-parity-manifest.json

      - name: Assemble parity engineering preview
        run: |
          python scripts/build_reader_bundle.py \
            --legacy-root legacy_snapshot \
            --destination _site \
            --config migration/github-pages-preview.yml \
            --site-url https://gttome.github.io/New-Daily-AI-Brief \
            --base-path New-Daily-AI-Brief \
            --greenfield-sha "${{ steps.meta.outputs.source_sha }}"
          python scripts/build_reader_parity_manifest.py \
            --legacy-root legacy_snapshot \
            --site-root _site \
            --output _artifacts/data-parity-manifest.json
          python scripts/validate_reader_bundle.py \
            --site-root _site \
            --target-url https://gttome.github.io/New-Daily-AI-Brief

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy engineering preview
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify actual deployed parity preview on desktop and phone user agents
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          desktop="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36"
          mobile="Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/154 Mobile Safari/537.36"
          for ua in "$desktop" "$mobile"; do
            html="$(curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 -A "$ua" "$base")"
            grep -q "Daily Generative AI Brief" <<<"$html"
            grep -q "September 23, 2026" <<<"$html"
            ! grep -q "GREENFIELD TEST" <<<"$html"
            ! grep -qi "command-center" <<<"$html"
          done
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}briefs-archive/" | grep -q "221 items"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}watchlist/" | grep -q "Emerging AI Watchlist"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}about/" | grep -q "About the Daily Generative AI Brief"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}briefs/2026-09-23/" | grep -q "How useful was this?"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}assets/js/comments.js" | grep -q "/api/comments"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}assets/js/feedback.js" | grep -q "/api/ratings"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "${base}assets/js/share.js" | grep -q "/api/events"
