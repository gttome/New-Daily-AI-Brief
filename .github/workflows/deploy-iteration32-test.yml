name: Greenfield Reader Engineering Preview

on:
  workflow_run:
    workflows: ["Greenfield Contracts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: greenfield-reader-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Resolve source
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.source_sha }}
      - name: Assemble engineering preview
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          rm -rf _site
          cp -R site _site
          python - <<'PY'
          import datetime, json, os
          payload={
            "source_sha":os.environ["SOURCE_SHA"],
            "deployed_at":datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            "environment":"engineering-preview-only",
            "production_cutover":False,
            "reader_target":"https://ndaib.gtome.chatgpt.site"
          }
          with open('_site/build.json','w',encoding='utf-8') as f: json.dump(payload,f,separators=(',',':'))
          PY
        env:
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy engineering preview only
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify parity preview on desktop and phone user agents
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          desktop='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          mobile='Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 Chrome/154 Mobile Safari/537.36'
          for ua in "$desktop" "$mobile"; do
            home="$(curl --fail --location --retry 4 --retry-all-errors -A "$ua" "$base")"
            grep -q 'The Daily Generative AI Brief' <<<"$home"
            ! grep -q 'GREENFIELD TEST' <<<"$home"
            ! grep -qi 'href=.*command-center' <<<"$home"
            curl --fail --location -A "$ua" "${base}briefs/2026-08-17/" >/dev/null
            curl --fail --location -A "$ua" "${base}briefs/2026-09-05/" >/dev/null
            curl --fail --location -A "$ua" "${base}briefs/2026-09-23/" >/dev/null
            curl --fail --location -A "$ua" "${base}stories/2026-09-23/copilot-for-jetbrains-adds-shared-skills-instructions-plan-review-and-tool-approvals/" >/dev/null
            curl --fail --location -A "$ua" "${base}watchlist/" >/dev/null
            curl --fail --location -A "$ua" "${base}briefs-archive/" >/dev/null
          done
          curl --fail --location "${base}daily-feed.xml" >/dev/null
          curl --fail --location "${base}feed.json" >/dev/null
          curl --fail --location "${base}build.json" | grep -q '"production_cutover":false'
